version: '3.8'

services:
  # ─── Core Infrastructure ───
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sahiix-postgres
    environment:
      POSTGRES_DB: sahiix
      POSTGRES_USER: sahiix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGVECTOR_MAX_DIMENSIONS: 2000
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahiix -d sahiix"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [sahiix-internal]

  redis:
    image: redis:7-alpine
    container_name: sahiix-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [sahiix-internal]

  # ─── Application Services ───
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: sahiix-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://sahiix:${POSTGRES_PASSWORD}@postgres:5432/sahiix
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - XAI_API_KEY=${XAI_API_KEY}
      - FREETHEAI_API_KEY=${FREETHEAI_API_KEY}
      - PUTER_AUTH_TOKEN=${PUTER_AUTH_TOKEN}
      - GROK_MODEL=grok-4.6
      - SAHIIX_OS_BASE=http://hermes:8765
      - PUBLIC_TUNNEL=https://${DOMAIN}
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks: [sahiix-internal, sahiix-external]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  web:
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile.web
    container_name: sahiix-web
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api/harness
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks: [sahiix-internal, sahiix-external]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ─── SAHIIX OS (Hermes) ───
  hermes:
    build:
      context: /root/.hermes
      dockerfile: ../deploy/Dockerfile.hermes
    container_name: sahiix-hermes
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_ADMIN_USERNAME=${TELEGRAM_ADMIN_USERNAME}
      - AUTONOMOUS_MODE=true
      - MCP_ENABLED=true
      - SWARM_ENABLED=true
      - HARNESS_API_URL=http://api:8000
    volumes:
      - hermes_data:/root/.hermes
      - /root/.hermes/config.json:/app/config.json:ro
    depends_on:
      - api
    restart: unless-stopped
    networks: [sahiix-internal]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ─── Unified System Orchestrator ───
  unified-system:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.unified
    container_name: sahiix-unified
    environment:
      - HARNESS_API_BASE=http://api:8000
      - SAHIIX_OS_BASE=http://hermes:8765
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GROK_MODEL=grok-4.6
      - XAI_API_KEY=${XAI_API_KEY}
    depends_on:
      - api
      - hermes
    restart: unless-stopped
    networks: [sahiix-internal]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ─── Ollama (Local LLMs) ───
  ollama:
    image: ollama/ollama:latest
    container_name: sahiix-ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/root/.ollama/models
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    networks: [sahiix-internal]
    # GPU support (uncomment if available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ─── Observability Stack ───
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sahiix-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks: [sahiix-internal]

  grafana:
    image: grafana/grafana:10.4.0
    container_name: sahiix-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks: [sahiix-internal, sahiix-external]

  loki:
    image: grafana/loki:2.9.0
    container_name: sahiix-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks: [sahiix-internal]

  promtail:
    image: grafana/promtail:2.9.0
    container_name: sahiix-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks: [sahiix-internal]

  # ─── Reverse Proxy ───
  nginx:
    image: nginx:alpine
    container_name: sahiix-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - api
      - web
      - grafana
    restart: unless-stopped
    networks: [sahiix-external]

  certbot:
    image: certbot/certbot:v2.10.0
    container_name: sahiix-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks: [sahiix-external]

  # ─── Backup ───
  backup:
    image: postgres:16-alpine
    container_name: sahiix-backup
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do /backup.sh; sleep 86400; done"]
    depends_on:
      - postgres
    restart: unless-stopped
    networks: [sahiix-internal]

volumes:
  postgres_data:
  redis_data:
  hermes_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  loki_data:
  backup_data:
  letsencrypt:
  certbot_webroot:

networks:
  sahiix-internal:
    driver: bridge
    internal: true
  sahiix-external:
    driver: bridge