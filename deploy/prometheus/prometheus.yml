global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'sahiix-production'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # SAHIIX API metrics
  - job_name: 'sahiix-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'sahiix-api'
          component: 'api'

  # SAHIIX Web metrics
  - job_name: 'sahiix-web'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['web:3000']
        labels:
          service: 'sahiix-web'
          component: 'web'

  # Hermes (SAHIIX OS)
  - job_name: 'sahiix-hermes'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['hermes:8765']
        labels:
          service: 'sahiix-hermes'
          component: 'os'

  # Unified System
  - job_name: 'sahiix-unified'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['unified-system:8000']
        labels:
          service: 'sahiix-unified'
          component: 'orchestrator'

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'
          component: 'database'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
          component: 'cache'

  # Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
        labels:
          service: 'nginx'
          component: 'proxy'

  # Node Exporter (host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          service: 'node-exporter'
          component: 'host'