name: Harness Self-Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  circular-import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check circular imports
        run: |
          python -c "import api.core"
          python -c "import api.main"
          python -c "import api.nexus_bridge"
          python -c "import api.gapclaw_bridge"
          python -c "import api.sara_bridge"
          python -c "import api.gapsolver_bridge"
          python -c "import api.db"
          python -c "import api.redis_client"
          python -c "import api.tools.apollo"
          python -c "import api.tools.brightdata"
          python -c "import api.tools.wati"

  test-suite:
    runs-on: ubuntu-latest
    needs: circular-import-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run mocked test suite
        run: pytest tests/ -v --ignore=tests/test_live_smoke.py --tb=short
      - name: Verify test count
        run: |
          COUNT=$(pytest tests/ --ignore=tests/test_live_smoke.py --collect-only -q | tail -1 | grep -oP '\d+')
          echo "Collected $COUNT tests"
          if [ "$COUNT" != "33" ]; then echo "Expected 33 tests, got $COUNT"; exit 1; fi

  safety-net:
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Verify safety net blocks real HTTP
        run: |
          python -c "
          import pytest
          from tests.conftest import _block_real_network
          import httpx
          _block_real_network()
          try:
              import asyncio
              asyncio.run(httpx.AsyncClient().get('https://example.com'))
              exit(1)
          except RuntimeError as e:
              assert 'REAL NETWORK CALL BLOCKED' in str(e)
              print('Safety net OK')
          "

  docker-compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker-compose config

  live-smoke-test:
    runs-on: ubuntu-latest
    needs: [test-suite, docker-compose-validation]
    if: github.ref == 'refs/heads/main' && secrets.AZURE_FOUNDRY_API_KEY != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run live smoke tests
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_BASE_URL: ${{ secrets.AZURE_FOUNDRY_BASE_URL }}
        run: pytest tests/test_live_smoke.py -v --tb=short
