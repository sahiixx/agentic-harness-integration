name: Harness Self-Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the provider-backed Azure smoke tests
        required: true
        default: false
        type: boolean

jobs:
  circular-import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check circular imports
        run: |
          python -c "import api.core"
          python -c "import api.main"
          python -c "import api.nexus_bridge"
          python -c "import api.gapclaw_bridge"
          python -c "import api.sara_bridge"
          python -c "import api.gapsolver_bridge"
          python -c "import api.db"
          python -c "import api.redis_client"
          python -c "import api.tools.apollo"
          python -c "import api.tools.brightdata"
          python -c "import api.tools.wati"

  test-suite:
    runs-on: ubuntu-latest
    needs: circular-import-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run mocked test suite
        run: pytest tests/ -v --ignore=tests/test_live_smoke.py --tb=short
      - name: Verify test count
        run: |
          COUNT=$(pytest tests/ --ignore=tests/test_live_smoke.py --collect-only -q | awk '/collected/{print $1; exit}')
          echo "Collected $COUNT tests"
          if [ "$COUNT" != "36" ]; then echo "Expected 36 mocked tests, got $COUNT"; exit 1; fi

  safety-net:
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Verify safety net blocks real HTTP
        run: |
          python - <<'PY'
          import asyncio
          from unittest.mock import patch

          import httpx

          def block_real_http(*args, **kwargs):
              raise RuntimeError("REAL NETWORK CALL BLOCKED")

          async def make_request():
              async with httpx.AsyncClient() as client:
                  await client.get("https://example.com")

          with patch.object(httpx.AsyncClient, "get", block_real_http):
              try:
                  asyncio.run(make_request())
              except RuntimeError as error:
                  assert "REAL NETWORK CALL BLOCKED" in str(error)
                  print("Safety net OK")
              else:
                  raise SystemExit("unmocked HTTP request was not blocked")
          PY

  docker-compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config

  live-smoke-test:
    name: Explicit Azure smoke test
    runs-on: ubuntu-latest
    needs: [test-suite, docker-compose-validation]
    if: github.event_name == 'workflow_dispatch' && inputs.run_live == true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate Azure configuration
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_BASE_URL: ${{ secrets.AZURE_FOUNDRY_BASE_URL }}
        run: |
          test -n "$AZURE_FOUNDRY_API_KEY" || { echo 'AZURE_FOUNDRY_API_KEY is required when run_live=true' >&2; exit 1; }
          case "$AZURE_FOUNDRY_BASE_URL" in
            https://*) ;;
            *) echo 'AZURE_FOUNDRY_BASE_URL must be an https URL when run_live=true' >&2; exit 1 ;;
          esac
      - name: Run live smoke tests
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_BASE_URL: ${{ secrets.AZURE_FOUNDRY_BASE_URL }}
        run: pytest tests/test_live_smoke.py -v --tb=short
