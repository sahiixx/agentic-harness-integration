version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    volumes:
      - ./api:/app/api
      - ./tests:/app/tests
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://harness:harness@db:5432/harness
      - REDIS_URL=redis://redis:6379/0
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
